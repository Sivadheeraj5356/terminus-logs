version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "security"
subcategories = ["long_context", "api_integration"]
number_of_milestones = 0
codebase_size = "small"
languages = ["go", "bash"]
tags = [
  "request-signing",
  "hmac-authorization",
  "canonicalization",
  "reverse-proxy",
  "key-rotation",
  "authority-boundary",
]
expert_time_estimate_min = 300
junior_time_estimate_min = 720

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 600

[environment]
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = false
