! dist-apac-tyo-main-02 — Cisco IOS-XE distribution switch
! migration_state: legacy
version 17.9
hostname dist-apac-tyo-main-02
!
ip routing
ip vrf CORP-IT
 rd 65000:1005
 route-target export 65000:1005
 route-target import 65000:1005
!
ip vrf FINANCE
 rd 65000:1105
 route-target export 65000:1105
 route-target import 65000:1105
!
interface Vlan2152
 description Finance gateway SVI
 ip vrf forwarding FINANCE
 ip address 10.215.2.1 255.255.255.0
 standby 10 ip 10.215.2.1
 standby 10 priority 100
 ip access-group ACL-INSIDE-ANY in
!
interface TenGigabitEthernet1/1/1
 description Uplink to core
 switchport trunk allowed vlan 2001-2180
 switchport mode trunk
!
interface TenGigabitEthernet1/1/2
 description Downlink to access
 switchport trunk allowed vlan all
 switchport mode trunk
!
router ospf 1 vrf FINANCE
 network 10.215.0.0 0.0.255.255 area 0
!
