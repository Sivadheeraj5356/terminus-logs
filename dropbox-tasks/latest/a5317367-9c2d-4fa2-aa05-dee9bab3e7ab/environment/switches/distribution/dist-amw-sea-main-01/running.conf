! dist-amw-sea-main-01 — Cisco IOS-XE distribution switch
! migration_state: partial
version 17.9
hostname dist-amw-sea-main-01
!
ip routing
ip vrf CORP-IT
 rd 65000:1001
 route-target export 65000:1001
 route-target import 65000:1001
!
ip vrf FINANCE
 rd 65000:1101
 route-target export 65000:1101
 route-target import 65000:1101
!
interface Vlan2111
 description Finance gateway SVI
 ip vrf forwarding FINANCE
 ip address 10.211.1.1 255.255.255.0
 standby 10 ip 10.211.1.1
 standby 10 priority 110
 ip access-group OG-FLAT-FINANCE in
!
interface TenGigabitEthernet1/1/1
 description Uplink to core
 switchport trunk allowed vlan 2001-2180
 switchport mode trunk
!
interface TenGigabitEthernet1/1/2
 description Downlink to access
 switchport trunk allowed vlan 2111-2131
 switchport mode trunk
!
router ospf 1 vrf FINANCE
 network 10.211.0.0 0.0.255.255 area 0
!
