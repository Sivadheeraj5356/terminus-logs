! dist-emea-lon-main-02 — Cisco IOS-XE distribution switch
! migration_state: partial
version 17.9
hostname dist-emea-lon-main-02
!
ip routing
ip vrf CORP-IT
 rd 65000:1002
 route-target export 65000:1002
 route-target import 65000:1002
!
ip vrf FINANCE
 rd 65000:1102
 route-target export 65000:1102
 route-target import 65000:1102
!
interface Vlan2122
 description Finance gateway SVI
 ip vrf forwarding FINANCE
 ip address 10.212.2.1 255.255.255.0
 standby 10 ip 10.212.2.1
 standby 10 priority 100
 ip access-group OG-FLAT-FINANCE in
!
interface TenGigabitEthernet1/1/1
 description Uplink to core
 switchport trunk allowed vlan 2001-2180
 switchport mode trunk
!
interface TenGigabitEthernet1/1/2
 description Downlink to access
 switchport trunk allowed vlan 2122-2142
 switchport mode trunk
!
router ospf 1 vrf FINANCE
 network 10.212.0.0 0.0.255.255 area 0
!
