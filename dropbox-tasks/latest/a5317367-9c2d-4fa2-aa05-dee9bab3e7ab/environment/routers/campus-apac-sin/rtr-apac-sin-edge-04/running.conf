! rtr-apac-sin-edge-04 — Cisco IOS-XE WAN edge router
! migration_state: segmented
version 17.9
hostname rtr-apac-sin-edge-04
!
ip vrf CORP-IT
 rd 65000:2044
 route-target export 65000:2044
 route-target import 65000:2044
!
ip vrf FINANCE
 rd 65000:2144
!
interface Loopback0
 ip vrf forwarding CORP-IT
 ip address 10.254.4.4 255.255.255.255
!
interface GigabitEthernet0/0/0
 description MPLS PE handoff
 ip vrf forwarding CORP-IT
 ip address 192.0.2.44 255.255.255.252
 ip access-group SEG-DMZ-IN in
 service-policy output PM-WAN_EDGE
!
interface GigabitEthernet0/0/0.100
 description CORP L3VPN subinterface
 encapsulation dot1Q 100
 ip vrf forwarding CORP-IT
 ip address 10.200.4.4 255.255.255.252
!
interface GigabitEthernet0/0/1
 description DMZ handoff
 ip vrf forwarding DMZ
 ip address 10.240.4.4 255.255.255.252
!
router bgp 65000
 bgp router-id 10.254.4.4
 address-family ipv4 vrf CORP-IT
  redistribute connected
  neighbor 192.0.2.43 remote-as 65001
  neighbor 192.0.2.43 activate
 exit-address-family
!
