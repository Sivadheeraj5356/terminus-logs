[workspace]
resolver = "2"
members = [
    "pkg/c01",
    "pkg/c02",
    "pkg/c03",
    "pkg/c04",
    "pkg/c05",
    "pkg/c06",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
hx01 = { path = "pkg/c01" }
hx02 = { path = "pkg/c02" }
hx03 = { path = "pkg/c03" }
hx04 = { path = "pkg/c04" }
hx05 = { path = "pkg/c05" }
hx06 = { path = "pkg/c06" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
toml = "0.8.19"
clap = { version = "4.5.27", features = ["derive"] }
thiserror = "2.0.11"
sha2 = "0.10.8"
hex = "0.4.3"
indexmap = { version = "2.7.1", features = ["serde"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
