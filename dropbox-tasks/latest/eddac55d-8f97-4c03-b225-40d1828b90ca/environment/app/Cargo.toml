[package]
name = "tzforge"
version = "2.4.0"
edition = "2021"

[[bin]]
name = "tzforge"
path = "src/main.rs"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-postgres = "0.7"

[profile.release]
debug = false
