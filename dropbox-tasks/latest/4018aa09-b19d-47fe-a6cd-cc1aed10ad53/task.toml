version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "security"
subcategories = []
number_of_milestones = 0
codebase_size = "small"
languages = ["python", "bash"]
tags = ["pki", "incident-response", "trust-graph", "policy-adjudication", "containment"]
