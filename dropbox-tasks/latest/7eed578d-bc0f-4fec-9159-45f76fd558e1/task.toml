# Task configuration schema version
version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "medium"
category = "security"
subcategories = ["db_interaction", "long_context"]
number_of_milestones = 3
codebase_size = "minimal"
languages = ["c", "bash"]
tags = ["openssl", "sqlite", "fraud-scoring", "hmac", "logistic-regression"]
expert_time_estimate_min = 90
junior_time_estimate_min = 180

[environment]
allow_internet = false
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"

[[steps]]
name = "milestone_1"

[steps.agent]
timeout_sec = 1200.0

[steps.verifier]
timeout_sec = 450.0

