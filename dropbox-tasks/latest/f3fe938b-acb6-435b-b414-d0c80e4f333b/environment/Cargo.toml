[package]
name = "md_convert"
version = "0.4.2"
edition = "2021"
authors = ["doctools-team <doctools@internal.example.com>"]
description = "Lightweight Markdown-to-HTML converter with summary statistics"

[[bin]]
name = "md_convert"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[profile.release]
opt-level = 3
lto = true
