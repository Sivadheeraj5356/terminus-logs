difficulty_explanation = "The verifier must combine exact chained-HMAC authentication with normalized caveat evaluation, immediate-parent attachment proofs, threshold quorum selection, and persistent replay state. Assignment is global: locally usable evidence may attach to the wrong edge, quorum members must have distinct authorities and proof identities, nested branches can invalidate lexically earlier choices, and both complete and best partial traversals affect later requests. Authenticated-but-denied requests still reserve nonces and spend selected discharges, while bad primaries do neither. Correctness therefore depends on coupled cryptographic, combinatorial, and state-transition reasoning rather than independent validation checks."
solution_explanation = "Normalize each request without mutating evidence, authenticate exact token chains, and audit every discharge locally against the state snapshot at request start. Model proof resolution as backtracking tasks carrying both caveat and immediate-parent signature. Track instance indexes and persistent replay identities separately; enumerate quorum combinations with distinct authorities, append members contiguously, then recurse through nested caveats. Compute complete and partial canonical assignments, apply reasons in fixed order, and only then append authenticated nonce and selected proof identities to persistent state in traversal order."
verification_explanation = "The independent oracle exercises nested edge attachment, bad-edge evidence that remains locally usable, quorum fallback and distinct-authority rules, contiguous quorum traversal, duplicate proof identities, preloaded nonce/discharge state, partial-assignment spending, inactive-key spending, and bad-primary non-spending. Generated cases also cover normalization, exact boundaries, additive reason order, non-greedy global assignment, strict hexadecimal checks, IPv4/IPv6, and final-state ordering. Exact schema checks and native-artifact checks reject hard-coded reports and helper-process delegation."

