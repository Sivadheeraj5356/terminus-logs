# Task configuration schema version
version = "2.0"

# Task metadata (author, difficulty, categorization)
[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "medium"
category = "build-and-dependency-management"
subcategories = ["db_interaction"]
number_of_milestones = 2
codebase_size = "small"
languages = ["elixir", "bash"]
tags = ["elixir", "mysql", "yaml", "toml", "mix", "build-pipeline"]
expert_time_estimate_min = 90
junior_time_estimate_min = 180

# Sandbox environment limits — applied across all milestones (the same container is shared)
[environment]
allow_internet = false
build_timeout_sec = 900.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"

# Milestone 1
[[steps]]
name = "milestone_1"

[steps.agent]
timeout_sec = 1200.0

[steps.verifier]
timeout_sec = 450.0

# Milestone 2
[[steps]]
name = "milestone_2"

[steps.agent]
timeout_sec = 1200.0

[steps.verifier]
timeout_sec = 450.0
