[Journal]
Path=/var/lib/sitefab/journal.json
Carry=epochs,stale_ref,latch

[Digest]
Source=health-cache

[Reconcile]
Mode=hand-wins
RequireDropIns=yes

[Barrier]
BumpRev=yes
ClearStale=no
CommitPending=no
ClearLatch=yes

[Visibility]
EpochOnRwAfterRo=yes
OmitStaleRefs=yes
DependentHold=immediate
DependToken=x-hold
MaintLatch=yes

[Compile]
PreferUnit=strict
SealPaths=yes
