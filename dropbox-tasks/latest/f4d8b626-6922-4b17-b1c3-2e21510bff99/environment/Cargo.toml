[package]
name = "expeditctl"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "expeditctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.23", features = ["derive"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.134" }
crc32fast = { version = "1.4.2" }
