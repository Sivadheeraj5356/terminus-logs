# Host auditd / augenrules flavor for local arctl exercises.
# Rule-tier fixtures live under fixtures/; this file is host policy flavor only.
log_file = /var/log/audit/audit.log
flush = incremental
max_log_file = 8
num_logs = 5
name_format = none
admin_space_left_action = suspend
disk_full_action = suspend
disk_error_action = suspend
tcp_listen_port =
tcp_listen_queue = 5
