version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "medium"
category = "games"
subcategories = []
number_of_milestones = 0
codebase_size = "minimal"
languages = [
    "typescript",
    "bash",
]
tags = [
    "games",
    "terminal-game",
    "escape-room",
    "container-puzzle",
    "puzzle-adjudication",
    "game-referee",
    "scorekeeping",
]
expert_time_estimate_min = 45
junior_time_estimate_min = 90

[environment]
os = "linux"
allow_internet = false
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"

[verifier]
timeout_sec = 300
environment_mode = "shared"

[agent]
timeout_sec = 900
