# Headless defaults for agent harnesses that wrap shells in tmux (escape timing and resize).
set -s escape-time 0
setw -g aggressive-resize on
set -g focus-events on
set -g history-limit 5000
# Avoid tearing down the tmux server when a short-lived probe session exits (stabilizes harness startups).
set -g exit-empty off
# Keep a pane target alive after the shell exits so harness capture/send does not fail with "no current target".
set -g remain-on-exit on
set -g detach-on-destroy off
