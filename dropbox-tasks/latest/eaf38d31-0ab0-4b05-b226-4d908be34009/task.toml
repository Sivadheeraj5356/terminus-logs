# Task configuration schema version
version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"
difficulty = "hard"
category = "security"
subcategories = ["api_integration"]
number_of_milestones = 6
codebase_size = "minimal"
languages = ["python"]
tags = ["ed25519", "cryptography", "flask", "transparency-log", "api"]
expert_time_estimate_min = 120
junior_time_estimate_min = 240

[environment]
allow_internet = false
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 10240
gpus = 0
gpu_types = []
docker_flags = []
workdir = "/app"

# Root-level defaults (some harness versions parse these at the top level even
# for multi-step tasks). Per-step [steps.agent]/[steps.verifier] below override.
[[steps]]
name = "milestone_1"

[steps.agent]
timeout_sec = 1800.0

[steps.verifier]
