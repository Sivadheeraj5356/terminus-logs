# Task configuration schema version
version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous@example.com"
difficulty = "hard"
category = "build-and-dependency-management"
subcategories = [ ]
number_of_milestones = 0
codebase_size = "minimal"
languages = [ "forth", "bash",]
tags = [ "gforth", "offline-build", "vendored-sources", "binary-records", "byte-order",]
expert_time_estimate_min = 120
junior_time_estimate_min = 300

[verifier]
timeout_sec = 1800.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 2700.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = false
