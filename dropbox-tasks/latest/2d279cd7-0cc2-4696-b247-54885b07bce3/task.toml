# Task configuration schema version
version = "2.0"

# Task metadata (author, difficulty, categorization)
[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "scientific-computing"
subcategories = [ ]
number_of_milestones = 0
codebase_size = "small"
languages = [ "javascript", "bash" ]
tags = [ "pde-solver", "wave-equation", "memory-constrained", "stencil-methods", "javascript", "numerical-methods" ]
expert_time_estimate_min = 60
junior_time_estimate_min = 120

[reference_pattern]
justification_if_none = "Explicit PDE solver implementation under a strict process memory cap in JavaScript is a distinct numeric/scientific computing pattern without a promoted reference task."

# Verifier: runs the test script to check task completion
[verifier]
timeout_sec = 450

# Agent: limits how long the agent can run when attempting the task
[agent]
timeout_sec = 900

# Sandbox environment limits
[environment]
allow_internet = false
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 10240
