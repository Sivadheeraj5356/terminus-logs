[workspace]
resolver = "2"
members = [
    "crates/docmodel",
    "crates/engine",
    "crates/bridge",
    "crates/ffi-model",
    "support",
    "tools/planctl",
    "tools/idlgen",
    "tools/inventory",
    "tools/attest",
    "tools/vellum-cli",
]
exclude = [
    "vendor/cargo/canonfmt-0.3.1",
    "vendor/cargo/canonfmt-0.4.0",
]

[profile.release]
opt-level = 2
