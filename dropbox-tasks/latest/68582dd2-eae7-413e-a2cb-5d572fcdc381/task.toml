version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "security"
subcategories = ["tool_specific"]
codebase_size = "small"
number_of_milestones = 0
languages = ["python", "bash"]
tags = [
  "acl",
  "identity-mapping",
  "trust-boundary",
  "rootless",
  "xattrs",
  "deployment-metadata",
]
expert_time_estimate_min = 180
junior_time_estimate_min = 480

[metadata.category_profile]
profile_name = "security_authority_split"
bug_family = "rootless_identity_acl_restore_boundary"

[metadata.reference_pattern]
justification_if_none = "No promoted reference matches rootless archive restore with id-mapped ownership, extended metadata, hardlink identity, and idempotent repeat-restore cleanup."

[agent]
timeout_sec = 1500

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 8192
allow_internet = false
