schema_version = "gaa-bounds-v1"

[reference]
temp_c = 25.0
vt = 0.026

[solver]
max_iterations = 48
step_fraction = 0.15
convergence_rmse = 1.0e-6

[parameters.vth0]
min = 0.20
max = 0.55
initial = 0.40

[parameters.u0]
min = 200.0
max = 700.0
initial = 400.0

[parameters.ss_factor]
min = 1.2
max = 2.5
initial = 2.0

[parameters.cgso]
min = 5.0e-11
max = 3.0e-10
initial = 1.0e-10

[parameters.rsd]
min = 50.0
max = 250.0
initial = 150.0

[parameters.k1]
min = 0.1
max = 1.2
initial = 0.6

[parameters.ute]
min = -2.5
max = -0.5
initial = -1.5

[parameters.kt1]
min = -0.05
max = 0.01
initial = -0.02

[parameters.subth_weight]
min = 5.0e-7
max = 5.0e-6
initial = 2.0e-6

[shared_groups.A]
tie_break_order = ["vth0", "u0", "ss_factor", "cgso", "rsd", "k1", "ute", "kt1", "subth_weight"]

[shared_groups.B]
tie_break_order = ["vth0", "u0", "ss_factor", "cgso", "rsd", "k1", "ute", "kt1", "subth_weight"]
