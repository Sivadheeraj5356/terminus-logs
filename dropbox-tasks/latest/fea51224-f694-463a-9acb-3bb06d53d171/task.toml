version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "system-administration"
subcategories = []
number_of_milestones = 0
codebase_size = "small"
languages = ["go", "bash"]
tags = ["thin-provisioning", "discard", "fstrim", "storage", "go", "sysadmin"]
expert_time_estimate_min = 90
junior_time_estimate_min = 240

[explanations]
difficulty = "Symptoms span guest span stride alignment, catalog fold authority, extent forward routing, and cross-peer slot-map digest convergence across two replay windows. Partial fixes often look plausible after cycle one but still fail stride transcript checks, peer epoch skew, propagation routing, idempotent reruns, and utilization gap tests. Agents must trace the reconstruction orchestrator through replay artifacts and distinguish the volutil export path from diagnostic listctl and the bundled readiness probe; empirical difficulty targets hard."

solution = "Run the documented replay script twice and compare trim_transcript.json, slot_map_digest.json, propagation_trace.jsonl, and convergence_report.json across cycles. Trace epoch carry from the prior transcript into the second window bootstrap, then reconcile span alignment stride, catalog fold peer authority, and forward batch routing. Rebuild volutil and listctl and rerun the replay pipeline to regenerate outputs."

verification = "The verifier deletes /app/output, reruns the replay script with controlled TRIM_CYCLES values, and asserts on regenerated artifacts plus live binary probes. Tests derive util ratio, session id, row width, and fixture ticks from config and fixtures rather than hardcoded answer keys. Cross-artifact checks cover trace tick ladders across windows, peer-lane alignment between digest and transcript, openssl body hashes, and idempotent append reruns."

[verifier]
timeout_sec = 450

[agent]
timeout_sec = 900

[environment]
allow_internet = false
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"
