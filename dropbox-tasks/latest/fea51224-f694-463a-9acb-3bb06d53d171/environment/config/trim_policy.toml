# Site trim maintenance policy — governs checkpoint, epoch floor, export scope, and trace bindings.

[checkpoint]
persist_mode = "epoch_ceiling"

[resume]
mask_from_checkpoint_gen = false

[epoch_floor]
source = "merged_artifact_ceiling"

[lane]
per_peer_stride = true

[inherit]
use_prior_lane = true

[align]
preserve_fixture_units_on_append = false

[digest]
fold_prior_on_second_pass = false
use_array_slots_on_second_pass = false

[trace]
array_metric = "cleared_ordinal"
volume_b_metric = "lane_tick"

[export]
transcript_mode = "active_window"
epoch_from_transcript_tail = true
use_first_digest_slots = false

[coordinator]
phase_generation = "track_window"

[series]
source = "profile_chain"
