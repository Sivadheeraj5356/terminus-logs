apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefetch-v1
  annotations:
    serving.mlp.io/framework: tensorflow-serving
    model.mlp.io/artifact-sha256: sha256:prefetchv1aa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prefetch-v1
  template:
    metadata:
      labels:
        app: prefetch-v1
        serving.k8s.io/role: model-server
      annotations:
        serving.mlp.io/framework: tensorflow-serving
        model.mlp.io/artifact-sha256: sha256:prefetchv1aa
    spec:
      initContainers:
        - name: model-server-warmup
          image: busybox:1.36
          resources:
            requests:
              cpu: "4000m"
              memory: "8192Mi"
          command: ["sh", "-c", "echo prefetch"]
      containers:
        - name: envoy-proxy
          image: envoyproxy/envoy:v1.28-latest
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
        - name: inference-model-server
          image: tensorflow/serving:2.14.0
          resources:
            requests:
              cpu: "2000m"
              memory: "4096Mi"
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v1/models/default
              port: 8501
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/models/default
              port: 8501
            initialDelaySeconds: 30
