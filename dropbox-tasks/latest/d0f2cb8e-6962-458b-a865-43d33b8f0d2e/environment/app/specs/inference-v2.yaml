apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-v2
  annotations:
    serving.mlp.io/framework: tensorflow-serving
    model.mlp.io/artifact-sha256: sha256:aa11bb22cc33
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inference-v2
  template:
    metadata:
      labels:
        app: inference-v2
        serving.k8s.io/role: model-server
      annotations:
        serving.mlp.io/framework: tensorflow-serving
        model.mlp.io/artifact-sha256: sha256:aa11bb22cc33
    spec:
      initContainers:
        - name: model-server-init
          image: busybox:1.36
          command: ["sh", "-c", "echo warmup"]
      containers:
        - name: metrics-sidecar
          image: prom/pushgateway:1.6.2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
        - name: model-server
          image: tensorflow/serving:2.14.0
          resources:
            requests:
              cpu: "2000m"
              memory: "4096Mi"
            limits:
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /v1/models/default
              port: 8501
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/models/default
              port: 8501
            initialDelaySeconds: 30
