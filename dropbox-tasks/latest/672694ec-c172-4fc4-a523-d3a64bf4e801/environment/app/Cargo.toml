[package]
name = "tpm2-quote-attestor"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tpm2-quote-attestor"
path = "src/main.rs"

[dependencies]
hex = "=0.4.3"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["preserve_order"] }
sha2 = "=0.10.8"
thiserror = "=2.0.12"
