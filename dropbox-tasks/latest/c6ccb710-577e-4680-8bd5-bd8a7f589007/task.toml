# BASE_IMAGE_JUSTIFICATION: Canonical public.ecr.aws/docker/library/python:3.13-slim-bookworm@sha256:01f42367a0a94ad4bc17111776fd66e3500c1d87c15bbd6055b7371d39c124fb supplies Python for the Harbor pytest verifier; GHC 9.0.2, cabal-install 3.4.1.0, and libghc-aeson-dev are pinned from Debian bookworm for offline Cabal packaging with no Hackage access at runtime.
# TASK_INSPIRATION: Inspired by shipyard drydock release incidents where Cabal-packaged keel-block load consoles shipped with mismatched edition ABI pins and inverted tension classifications, leaving packaging inventories unsigned while dockside load cells continued reporting.

version = "2.0"

