# Task configuration schema version
version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "build-and-dependency-management"
category_profile = "build_dependency_toolchain"
subcategories = ["tool_specific"]
number_of_milestones = 2
codebase_size = "minimal"
languages = ["go", "bash"]
tags = ["git", "go", "webhooks", "relay", "persistence", "retry", "bisect"]
expert_time_estimate_min = 150
junior_time_estimate_min = 300

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 1200

[environment]
allow_internet = false
build_timeout_sec = 1200
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"

[[steps]]
name = "milestone_1"

[steps.agent]
timeout_sec = 1800

[steps.verifier]
timeout_sec = 1200

[[steps]]
name = "milestone_2"

[steps.agent]
timeout_sec = 1200

[steps.verifier]
timeout_sec = 900
