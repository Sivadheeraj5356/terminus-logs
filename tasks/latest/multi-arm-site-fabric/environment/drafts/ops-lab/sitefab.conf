[Journal]
Path=/var/lib/sitefab/journal.json
Carry=epochs,last_ro,stale_ref,pending_arms

[Digest]
Source=durable-store

[Reconcile]
Mode=gen-hand-bs
RequireDropIns=no

[Barrier]
BumpRev=yes
ClearStale=yes
CommitPending=yes
ClearLatch=no

[Visibility]
EpochOnRwAfterRo=yes
OmitStaleRefs=yes
DependentHold=until-propagate
DependToken=
MaintLatch=no

[Compile]
PreferUnit=loose
SealPaths=no
