[Journal]
Path=/tmp/sitefab-journal.json
Carry=epochs,last_ro,stale_ref,pending_arms,latch

[Digest]
Source=durable-store

[Reconcile]
Mode=gen-hand-bs
RequireDropIns=yes

[Barrier]
BumpRev=yes
ClearStale=yes
CommitPending=yes
ClearLatch=yes

[Visibility]
EpochOnRwAfterRo=yes
OmitStaleRefs=no
DependentHold=until-propagate
DependToken=x-hold
MaintLatch=yes

[Compile]
PreferUnit=strict
SealPaths=yes
