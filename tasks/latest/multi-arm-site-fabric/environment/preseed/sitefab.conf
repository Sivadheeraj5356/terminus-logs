# stale regional install — missing carry keys and wrong digest mode
[Journal]
Path=/var/lib/sitefab/journal.json
Carry=epochs

[Digest]
Source=health-cache

[Reconcile]
Mode=hand-wins
RequireDropIns=no

[Barrier]
BumpRev=no
ClearStale=no
CommitPending=no
ClearLatch=no

[Visibility]
EpochOnRwAfterRo=no
OmitStaleRefs=no
DependentHold=immediate
DependToken=
MaintLatch=no

[Compile]
PreferUnit=loose
SealPaths=no
