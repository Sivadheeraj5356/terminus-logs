# Pinned verifier config. test.sh passes this explicitly with `pytest -c` so
# pytest never discovers a config file on its own. That matters because the
# --ctrf argument points at /logs and pulls pytest's config search up to /,
# where a planted /pytest.ini would otherwise be picked up - it could force
# rootdir=/ (re-enabling a /conftest.py short-circuit) or inject
# addopts = --collect-only to exit 0 without running a single check. Passing
# -c here bypasses that discovery entirely. Keep run-specific options on the
# command line in test.sh.
[pytest]
