version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "games"
subcategories = ["tool_specific"]
tags = ["rust", "chess", "fide", "repetition", "position-key", "engine"]
languages = ["rust", "bash"]
codebase_size = "small"
number_of_milestones = 3
expert_time_estimate_min = 120
junior_time_estimate_min = 300

[environment]
allow_internet = false
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
docker_flags = []
gpus = 0
gpu_types = []
workdir = "/app"

[[steps]]
name = "milestone_1"

[steps.agent]
timeout_sec = 1200

[steps.verifier]
timeout_sec = 600

[[steps]]
name = "milestone_2"

[steps.agent]
timeout_sec = 1500

[steps.verifier]
timeout_sec = 900

[[steps]]
name = "milestone_3"

[steps.agent]
timeout_sec = 1800

[steps.verifier]
timeout_sec = 900
