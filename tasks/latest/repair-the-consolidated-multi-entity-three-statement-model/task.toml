# Task configuration schema version
version = "2.0"

[metadata]
custom_docker_compose = true
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "data-processing"
subcategories = [ ]
number_of_milestones = 0
codebase_size = "minimal"
languages = [ "go" ]
tags = [ "finance", "financial-modeling", "integer-arithmetic", "circular-reference", "working-capital", "gaap", "deferred-taxes", "stock-based-compensation", "multi-document", "consolidation", "minority-interest", "intercompany-elimination", "debt-covenants", "multi-period",]
expert_time_estimate_min = 420
junior_time_estimate_min = 960

[verifier]
timeout_sec = 450.0

[agent]
timeout_sec = 1200.0

[environment]
allow_internet = false
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
