ordering:
  primary_key: seq
  secondary_key: toolchain
compression:
  ratio_numerator: 1
  ratio_denominator: 2
cross_toolchain:
  require_final_hash_match: true
rollback:
  require_symbol_match: true
distributed:
  require_shard_coverage: true
optimization:
  flag_divergent_fingerprints: true
stress:
  enforce_toolchain_fix_order: true
divergence_kinds:
  - nondeterministic_emit
  - hash_chain_break
  - missing_checkpoint_event
  - checkpoint_hash_mismatch
  - checkpoint_symbol_mismatch
  - compression_invalid
  - compression_ratio_mismatch
  - symbol_state_drift
  - artifact_mismatch
  - rollback_checkpoint_missing
  - rollback_expected_mismatch
  - rollback_restore_failed
  - shard_hash_mismatch
  - shard_coverage_gap
