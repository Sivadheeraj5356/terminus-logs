[package]
name = "wincontam"
version = "0.1.0"
edition = "2021"
description = "Contamination-aware chat-eval metrics and inference feature scoring"

[[bin]]
name = "wincontam"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
