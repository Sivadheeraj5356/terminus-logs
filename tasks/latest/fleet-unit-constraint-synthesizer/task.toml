version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "system-administration"
tags = ["systemd", "go", "rust", "fleet", "config-synthesis"]
languages = ["go", "rust", "bash"]
codebase_size = "small"
number_of_milestones = 0
subcategories = ["tool_specific"]
expert_time_estimate_min = 45
junior_time_estimate_min = 150

[category_profile]
challenge_family = "fleet_unit_synthesis"
profile_name = "config_policy_precedence"
allowed_instruction_disclosures = "subsystem paths, precedence rules, output schemas, digest formulas, scenario names"
forbidden_instruction_leaks = "exact patch files, function names on fix path, oracle transcripts"
category_specific_hardness_bar = "multi-language coordinated repair across resolver, emitter, trace, and packer"
category_specific_verifier_risks = "hand-written tarball bytes, partial layer fixes, stale binaries"
coverage_role = "system-administration tool_specific"

[reference_pattern]
justification_if_none = "Fleet unit synthesis from layered manifests is distinct from WAL, durable-task, and module-graph recovery tasks in the reference catalog."

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 900

[environment]
allow_internet = false
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 10240
