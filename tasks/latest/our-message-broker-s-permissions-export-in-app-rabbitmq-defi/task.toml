# Task configuration schema version
version = "2.0"

# Task metadata (author, difficulty, categorization)
[metadata]
author_name = "task-author"
author_email = "task-author@example.com"
difficulty = "hard"
category = "security"
# Options for subcategories are: "long_context", "tool_specific", "api_integration", "db_interaction", "ui_building"
subcategories = []
# The number of milestones in the task (can be zero if not a milestone task)
number_of_milestones = 0
# Size of the codebase: minimal -> 0-20 files, small -> 20+ files, large -> 200+ files
codebase_size = "minimal"
# Coding languages used in the oracle solution or required by the agent
languages = [ "bash" ]
# For tool_specific, api_integration, and db_interaction subcategories, please include specific tool, api framework, or database software
tags = [ "rabbitmq", "message-broker", "access-control", "policy-remediation", "time-boxed-access" ]
# Estimated time to complete (minutes)
expert_time_estimate_min = 80
junior_time_estimate_min = 180

# Verifier: parses the agent's edited /app/rabbitmq_definitions.json with an
# independent JSON parser plus its own regex-capability resolver, cross-
# references PERMISSION_CHANGELOG.md (latest-DATED entry wins, superseding
# tier defaults AND documented overrides), DOWNSTREAM_CONSUMERS.md,
# PROTECTED_SERVICE_ACCOUNTS.md, and INCIDENT_ACCESS.md (time-boxed grants
# evaluated against a fixed current date), and independently recomputes the
# tier-default/override/changelog/incident/dual-budget expected state,
# checking ACCESS DECISIONS for representative resource names rather than
# comparing regex strings verbatim, never re-using the oracle's own code.
[verifier]
timeout_sec = 300.0

# Agent: limits how long the agent can run when attempting the task
[agent]
timeout_sec = 1800.0

# Sandbox environment limits
[environment]
allow_internet = false
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
