version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
# difficulty is a construction-time target based on bug complexity (stateful/interacting
# bugs, cross-run reasoning, cargo-native mirror/config/lock coupling). NOT empirically
# confirmed — no agent runs completed (missing API credentials in this environment).
# Reviewer must run harbor eval before trusting this label.
difficulty = "hard"
category = "build-and-dependency-management"
subcategories = []
tags = ["rust", "cargo", "local-registry", "lockfile", "offline-build", "registry-mirror"]
languages = ["rust"]
codebase_size = "minimal"
number_of_milestones = 0
expert_time_estimate_min = 120
junior_time_estimate_min = 360

[agent]
timeout_sec = 1800

[verifier]
timeout_sec = 900

[reference_pattern]
justification_if_none = "No promoted reference in docs/reference_tasks/index.json fits cargo sparse index mirror skew; references list is empty."

[environment]
allow_internet = false
build_timeout_sec = 600
cpus = 2
memory_mb = 4096
storage_mb = 10240
