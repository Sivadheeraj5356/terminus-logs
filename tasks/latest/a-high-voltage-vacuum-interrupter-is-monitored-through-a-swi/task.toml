version = "2.0"

[metadata]
author_name = "anonymous"
author_email = "anonymous"
difficulty = "hard"
category = "scientific-computing"
subcategories = []
number_of_milestones = 0
codebase_size = "minimal"
languages = ["C++"]
tags = ["high-voltage", "vacuum-interrupter", "continuous-time", "dielectric-physics", "numerical-modeling"]
expert_time_estimate_min = 100
junior_time_estimate_min = 300
difficulty_explanation = """This task is hard because the solver must reconstruct a continuous-time hysteresis state machine from piecewise-linear measurements. Quadratic stress curves, exact threshold contacts, qualification timing, conditioning visibility, erosion integration, welding latches, and same-time event ordering all interact, so interval-only or sample-only implementations miss boundary cases."""
solution_explanation = """The solution parses the newline-delimited JSON stream, batches simultaneous readings in input order, analytically partitions each drift interval at strike and clear roots, advances qualification and erosion over those intervals, and emits canonical contiguous operating-state spans."""
verification_explanation = """Verification builds the submitted C++17 source as a native ELF and compares its spans with an independent reference model. It checks schema and exact window coverage plus generated cases for quadratic crossings, tangent threshold contacts, event ordering, conditioning, qualification resets, erosion welding, and runtime input changes."""

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 1800.0

[environment]
allow_internet = false
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
workdir = "/app"
