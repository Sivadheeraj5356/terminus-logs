include "/app/live/keys/harbor-ops.key";

options {
    directory "/app/live/run";
    listen-on port 5300 { any; };
    listen-on-v6 { none; };
    pid-file "/app/live/run/named.pid";
    session-keyfile "/app/live/run/session.key";
    version "not disclosed";
    empty-zones-enable no;
    dnssec-validation no;
};

logging {
    channel rpz_file { file "/app/live/run/rpz.log" versions 2 size 1m; severity info; print-category yes; buffered no; };
    category rpz { rpz_file; };
};

view "internal" {
    match-clients { 127.0.0.1; };
    recursion yes;
    allow-recursion { 127.0.0.0/8; };
    max-cache-ttl 0;
    max-ncache-ttl 0;
    allow-transfer { key harbor-ops; };
    response-policy { zone "internal.rpz" policy given; } qname-wait-recurse no;
    zone "harbor.test" {
        type primary;
        file "/app/live/zones/internal.harbor.test.zone";
        update-policy { grant harbor-ops wildcard "*.dynamic.harbor.test" A AAAA; };
    };
    zone "2.0.192.in-addr.arpa" { type primary; file "/app/live/zones/internal.192.0.2.zone"; allow-update { none; }; };
    zone "internal.rpz" { type primary; file "/app/live/zones/internal.rpz"; allow-query { none; }; };
};

view "external" {
    match-clients { any; };
    recursion no;
    allow-transfer { none; };
    zone "harbor.test" { type primary; file "/app/live/zones/external.harbor.test.zone"; allow-update { none; }; };
    zone "2.0.192.in-addr.arpa" { type primary; file "/app/live/zones/external.192.0.2.zone"; allow-update { none; }; };
};
