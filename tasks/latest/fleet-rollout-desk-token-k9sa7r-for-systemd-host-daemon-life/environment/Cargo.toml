[package]
name = "k9_desk"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "k9_invoke"
path = "cli/k9_invoke.rs"

[[bin]]
name = "k9_emit"
path = "cli/k9_emit.rs"

[[bin]]
name = "k9_recover"
path = "cli/k9_recover.rs"

[dependencies]
crc32fast = "=1.4.2"
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
sha2 = "=0.10.8"
