! core-apac-sin-01 — Cisco IOS-XE core switch
! migration_state: partial
version 17.9
hostname core-apac-sin-01
!
ip routing
!
interface TenGigabitEthernet1/1/1
 description Core fabric link
 switchport trunk allowed vlan 2001-2180
 switchport mode trunk
!
interface TenGigabitEthernet1/1/2
 description To distribution
 switchport trunk allowed vlan 2001-2099,3001-3099
 switchport mode trunk
!
interface Loopback0
 ip address 10.255.4.1 255.255.255.255
!
router ospf 1
 network 10.255.4.0.0 0.0.255.255 area 0
!
