/* acc-apac-sin-hub-01 — Juniper EX4300 */
system {
    host-name acc-apac-sin-hub-01;
}
vlans {
    SEG-045 {
        vlan-id 2045;
    }
    LEGACY-FLAT-045 {
        vlan-id 145;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members LEGACY-FLAT-045;
                }
            }
        }
    }
    xe-0/1/0 {
        unit 0 {
            family ethernet-switching {
                interface-mode trunk;
                vlan {
                    members [ SEG-045 SEG-046 ];
                }
            }
        }
    }
}
