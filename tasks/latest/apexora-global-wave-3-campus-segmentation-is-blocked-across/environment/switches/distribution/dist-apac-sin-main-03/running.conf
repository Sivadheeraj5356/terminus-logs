! dist-apac-sin-main-03 — Cisco IOS-XE distribution switch
! migration_state: segmented
version 17.9
hostname dist-apac-sin-main-03
!
ip routing
ip vrf CORP-IT
 rd 65000:1004
 route-target export 65000:1004
 route-target import 65000:1004
!
ip vrf FINANCE
 rd 65000:1104
 route-target export 65000:1104
 route-target import 65000:1104
!
interface Vlan2143
 description Finance gateway SVI
 ip vrf forwarding FINANCE
 ip address 10.214.3.1 255.255.255.0
 standby 10 ip 10.214.3.1
 standby 10 priority 100
 ip access-group SEG-FINANCE-IN in
!
interface TenGigabitEthernet1/1/1
 description Uplink to core
 switchport trunk allowed vlan 2001-2180
 switchport mode trunk
!
interface TenGigabitEthernet1/1/2
 description Downlink to access
 switchport trunk allowed vlan 2143-2163
 switchport mode trunk
!
router ospf 1 vrf FINANCE
 network 10.214.0.0 0.0.255.255 area 0
!
