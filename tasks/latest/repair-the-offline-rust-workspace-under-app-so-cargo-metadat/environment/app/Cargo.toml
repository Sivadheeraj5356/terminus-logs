[workspace]
members = [
    "crates/metrics-core",
    "crates/metrics-macros",
    "crates/metrics-cli",
    "crates/metacycle-core",
    "crates/metacycle-cli",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
